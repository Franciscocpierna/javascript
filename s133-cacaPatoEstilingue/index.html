<!-- Define o documento como HTML5 -->
<!DOCTYPE html>

<!-- Início do documento HTML -->
<html lang="pt-BR">
<!-- Define o idioma principal da página como 
        português do Brasil -->

<head>
    <!-- Configurações e metadados da página -->

    <!-- Define a codificação de caracteres como UTF-8, 
            permitindo o uso de caracteres especiais como acentos -->
    <meta charset="UTF-8">

    <!-- Configura a viewport para ajustar a página de forma 
            responsiva em dispositivos móveis -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Define o título da página, que será exibido na 
            aba do navegador -->
    <title>Caça ao Pato com Estilingue</title>

    <!-- Vincula o arquivo CSS externo para 
            estilização da página -->
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <!-- Conteúdo principal da página -->

    <!-- Define um elemento canvas onde o jogo será renderizado -->
    <!-- `id="gameCanvas"` é usado para referenciar o 
            canvas no JavaScript -->
    <!-- `width="400"` e `height="600"` definem as 
            dimensões do canvas em pixels -->
    <canvas id="gameCanvas" width="400" height="600"></canvas>

    <!-- Vincula o arquivo JavaScript externo para 
            adicionar interatividade e lógica ao jogo -->
    <script src="script.js"></script>
    
</body>

</html>
<!-- Fim do documento HTML -->
