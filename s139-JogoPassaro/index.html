<!-- Define o tipo de documento como HTML5, que é a 
        versão mais recente e amplamente usada do HTML. -->
<!DOCTYPE html>

<!-- Inicia a estrutura do documento HTML e define o 
        idioma principal como português. -->
<html lang="pt">

<!-- Início da seção de cabeçalho do documento HTML. -->
<head>

    <!-- Especifica o conjunto de caracteres para a página 
            como UTF-8, permitindo o uso de caracteres 
            especiais como acentos. -->
    <meta charset="UTF-8">

    <!-- Define o título da página que será exibido na 
            aba do navegador. -->
    <title>Jogo do Pássaro</title>

    <!-- Inclui um arquivo externo de estilos 
            chamado 'styles.css' para estilizar a página. -->
    <link rel="stylesheet" href="styles.css">

</head>

<!-- Início da seção do corpo do documento HTML. -->
<body>

    <!-- Cria um elemento <canvas> onde o jogo será renderizado. 
         Define a largura como 400 pixels e a altura como 600 pixels. -->
    <canvas id="gameCanvas" width="400" height="600"></canvas>

    <!-- Inclui um arquivo externo de script chamado 'script.js', 
            onde a lógica do jogo está implementada. -->
    <script src="script.js"></script>

</body>

<!-- Finaliza a estrutura do documento HTML. -->
</html>
