<!-- Especifica que o documento é HTML5 -->
<!DOCTYPE html>

<!-- Início do documento HTML, define o idioma do 
        documento como Português do Brasil -->
<html lang="pt-BR">

<!-- Início da cabeça do documento, que contém metadados e 
        links para scripts e folhas de estilo -->
<head>

    <!-- Define a codificação de caracteres para UTF-8, que 
            inclui a maioria dos caracteres usados em vários idiomas -->
    <meta charset="UTF-8">

    <!-- Título do documento, que aparece na aba do navegador -->
    <title>Jogo da Garrafa</title>

    <!-- Link para a folha de estilo externa, especifica o 
            caminho para o arquivo CSS que estiliza a página -->
    <link rel="stylesheet" href="styles.css">

<!-- Fecha a tag head -->
</head>


<!-- Início do corpo do documento, onde o conteúdo 
        visível da página é colocado -->
<body>

    <!-- Elemento canvas para gráficos, usado para desenhar o 
            jogo da garrafa, definindo largura e altura -->
    <canvas id="tela" width="850" height="650"></canvas>

    <!-- Link para o arquivo JavaScript externo que 
            contém a lógica do jogo -->
    <script src="script.js"></script>

<!-- Fecha a tag body -->
</body>

<!-- Fecha a tag html -->
</html>
