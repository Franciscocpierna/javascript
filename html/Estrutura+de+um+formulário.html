<!--
Estrutura de um formulário: Uso de <form> e seu processamento.

Formulários são uma parte essencial da interação do usuário em websites,
permitindo aos usuários enviar informações que podem ser processadas por
um servidor ou manipuladas client-side com JavaScript. O elemento <form> é
o contêiner principal para esses controles de entrada. Neste exemplo,
demonstrarei a estrutura básica de um formulário em HTML, explicando como
configurar um formulário para envio e processamento, incluindo a
utilização de vários elementos de entrada comuns.
-->

<!DOCTYPE html>
<!-- A declaração <!DOCTYPE html> indica ao navegador que esta é uma 
    página HTML5, a versão mais recente do HTML, garantindo que o 
    navegador a processe corretamente. -->

<html lang="pt">
<!-- A tag <html> marca o início do documento HTML. O atributo 'lang="pt"' 
    especifica que o idioma principal do documento é o português, o que 
    ajuda os navegadores a fornecerem funcionalidades locais apropriadas, 
    como correção ortográfica e formatação. -->

<head>
    <!-- A seção <head> contém metadados, links para folhas de estilo e 
        scripts que não são diretamente visíveis na página. -->
    
    <meta charset="UTF-8">
    <!-- A tag <meta> com o atributo 'charset="UTF-8"' define o conjunto 
        de caracteres usado para o conteúdo da página como UTF-8, que suporta 
        quase todos os caracteres e símbolos do mundo, assegurando que 
        qualquer texto seja exibido corretamente. -->
    
    <title>Formulário de Contato</title>
    <!-- A tag <title> define o título da página, que aparece na aba do 
        navegador e é usado pelos motores de busca para identificar o 
        conteúdo da página. -->

</head>

<body>
    <!-- A tag <body> contém tudo o que é visível para o usuário na 
        página, como texto, imagens, links, formulários, etc. -->

    <h1>Formulário de Contato</h1>
    <!-- A tag <h1> define um cabeçalho, que é o título principal na 
        página. Usar <h1> ajuda na estruturação do conteúdo e melhora a 
        acessibilidade e SEO (otimização para motores de busca). -->

    <!-- Estrutura do formulário -->
    <form action="processar_formulario.php" method="POST">
    <!-- A tag <form> é usada para criar um formulário onde os 
                usuários podem inserir dados. 
         'action' define a URL do script no servidor que vai processar os
                 dados enviados pelo formulário.
         'method' POST especifica que os dados do formulário serão 
                enviados através do método HTTP POST, que é seguro porque os 
                dados não aparecem na URL. -->

        <fieldset>
        <!-- A tag <fieldset> é utilizada para agrupar elementos semelhantes
                     no formulário, geralmente com um contorno ao redor para 
                     melhor organização visual. -->
            
            <legend>Informações Pessoais</legend>
            <!-- A tag <legend> define um título para o grupo criado por <fieldset>, 
                    ajudando os usuários a entender o contexto dos dados 
                    que serão inseridos. -->

            <label for="nome">Nome:</label>
            <!-- A tag <label> define um rótulo para um campo de entrada. 
                    O atributo 'for' deve corresponder ao 'id' de um elemento <input>, 
                    <textarea> ou <select> no mesmo documento, criando uma associação 
                    funcional: clicar no <label> foca o campo correspondente, o 
                    que melhora a acessibilidade. -->
            
            <input type="text" id="nome" name="nome" required>
            <!-- A tag <input type="text"> cria um campo para entrada de texto. 
                 'id' atribui uma identificação única ao elemento, que é 
                        referenciada pelo 'for' em <label>.
                 'name' é o nome do campo que será enviado ao servidor.
                 'required' indica que o campo deve ser preenchido antes 
                        de enviar o formulário. -->

            <label for="email">E-mail:</label>
            <!-- Rótulo para o campo de e-mail. O uso de 'for' conecta o 
                    rótulo ao campo de entrada correspondente. -->
            
            <input type="email" id="email" name="email" required>
            <!-- <input type="email"> especifica que o campo é para endereços de 
                    e-mail, com validação automática do formato de e-mail. -->

            <label for="mensagem">Mensagem:</label>
            <!-- Rótulo para o campo de entrada de texto de múltiplas linhas. -->
            
            <textarea id="mensagem" name="mensagem" rows="4" required></textarea>
            <!-- <textarea> cria uma área de texto para entrada de 
                        texto longo, útil para mensagens. 
                 'rows' define o número de linhas visíveis.
                 'required' assegura que a mensagem não seja enviada vazia. -->
        </fieldset>

        <fieldset>
        <!-- Segundo <fieldset> usado para agrupar outra seção do formulário. -->
            
            <legend>Preferências</legend>
            <!-- Título do grupo, indicando que esta seção trata das 
                    preferências do usuário. -->

            <label for="noticias">Deseja receber nossa newsletter?</label>
            <!-- Rótulo associado a um campo de tipo caixa de seleção. -->
            
            <input type="checkbox" id="noticias" name="noticias" checked>
            <!-- <input type="checkbox"> cria uma caixa que o usuário pode 
                    marcar ou desmarcar.
                 'checked' indica que a caixa de seleção já estará marcada por 
                    padrão quando o usuário carregar o formulário. -->

            <label for="setor">Setor de interesse:</label>
            <!-- Rótulo para uma lista suspensa, facilitando a escolha de 
                    uma opção em categorias. -->
            
            <select id="setor" name="setor">
            <!-- <select> cria uma lista suspensa para seleção entre múltiplas 
                    opções predefinidas. -->

                <option value="vendas">Vendas</option>
                <!-- <option> define uma opção individual na lista. 'value' é 
                    o dado enviado ao servidor. -->

                <option value="suporte">Suporte</option>
                <!-- Outra opção na lista suspensa. -->

                <option value="geral">Geral</option>
                <!-- Mais uma opção disponível para escolha. -->

            </select>
        </fieldset>

        <button type="submit">Enviar</button>
        <!-- <button type="submit"> cria um botão que, ao ser clicado, 
                submete os dados do formulário para o servidor como definido no 
                atributo 'action' de <form>. -->
        
        <button type="reset">Limpar</button>
        <!-- <button type="reset"> cria um botão que, ao ser clicado, 
                reseta os campos do formulário para seus valores iniciais, 
                limpa os dados inseridos pelo usuário. -->
                
    </form>
</body>
</html>

<!--
Explicação do Exemplo

Elemento <form>
action: Especifica o URL para o qual os dados do formulário serão
    enviados após a submissão. No exemplo, os dados são enviados para
    processar_formulario.php, que deve ser um script do lado do servidor
    capaz de processar as informações.
method: Define o método HTTP usado para enviar o formulário. POST é usado
    aqui para enviar dados de maneira segura, onde os dados não são
    expostos na URL.

Elemento <fieldset> e <legend>
<fieldset>: Usado para agrupar elementos relacionados dentro de um
    formulário, melhorando a organização visual e a acessibilidade.
<legend>: Fornece um título ou legenda para o grupo de campos, explicando o
    contexto das entradas agrupadas.

Controles de Entrada
<input type="text">: Campo para entrada de texto.
<input type="email">: Campo para entrada de email, inclui validação
    automática de formato de email.
<textarea>: Área de texto para mensagens ou conteúdo mais extenso.
<input type="checkbox">: Caixa de seleção que permite escolhas
    binárias (marcado ou não marcado).
<select> e <option>: Lista suspensa que permite escolher uma das
    várias opções.

Botões
<button type="submit">: Botão que envia o formulário para o servidor.
<button type="reset">: Botão que limpa todos os campos do
    formulário para seus valores iniciais.

Este exemplo abrange a criação básica de um formulário, desde a entrada de
dados até a submissão, utilizando atributos e elementos que garantem uma
interação eficaz e acessível para o usuário. Formulários bem estruturados
são fundamentais para a coleta de dados de forma eficiente e segura em
qualquer website.
-->
