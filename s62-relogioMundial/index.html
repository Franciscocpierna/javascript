<!DOCTYPE html>
<!-- Define o tipo de documento como HTML5 -->

<html lang="pt-BR">
<!-- Abertura da tag <html> com atributo de idioma 
            definido como português do Brasil -->

<head>

    <meta charset="UTF-8">
    <!-- Define a codificação de caracteres do documento como UTF-8 -->
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Define a configuração do viewport para garantir que a 
                 página seja responsiva.
         O "width=device-width" define a largura da página para seguir a 
                     largura da tela do dispositivo.
         O "initial-scale=1.0" define o nível de zoom inicial 
                     quando a página é carregada. -->
    
    <title>Relógio Mundial</title>
    <!-- Define o título da página que aparece na aba do navegador -->
    
    <link rel="stylesheet" href="styles.css">
    <!-- Vincula o arquivo de estilos externo (CSS) para a página -->

</head>
<!-- Fecha a seção <head> onde são colocadas as meta-informações 
                sobre o documento -->


<body>
    <!-- Abertura da tag <body> onde todo o conteúdo visível da 
                    página será colocado -->
    
    <div class="relogio-mundial">
        <!-- Div contêiner principal para os relógios mundiais, com a 
                     classe "relogio-mundial" para estilização -->
        
        <h1>Relógio Mundial</h1>
        <!-- Título principal da página, que será exibido como um 
                     cabeçalho de nível 1 -->
        
        <div id="relogios">
            <!-- Div onde os relógios serão inseridos dinamicamente pelo 
                         JavaScript. O id "relogios" é usado para identificar
                        este elemento no script JavaScript -->
            
            <!-- Os relógios serão inseridos aqui pelo JavaScript -->

        </div>
        <!-- Fecha a div com id "relogios" -->

    </div>
    <!-- Fecha a div com a classe "relogio-mundial" -->
    
    <script src="script.js"></script>
    <!-- Vincula o arquivo JavaScript externo (script.js) que 
                 conterá a lógica para atualizar os relógios -->
                 
</body>
<!-- Fecha a tag <body> -->

</html>
<!-- Fecha a tag <html> e encerra o documento HTML -->
