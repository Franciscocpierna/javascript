<!-- Declaração do tipo de documento, especifica 
        que este é um documento HTML5. -->
<!DOCTYPE html>

<!-- Início do elemento raiz do HTML, com o atributo 
        lang definindo o idioma da página como Português do Brasil. -->
<html lang="pt-BR">

<!-- Início da seção head, que contém metadados e 
        links para recursos externos. -->
<head>

    <!-- Define a codificação de caracteres para UTF-8, 
            que inclui a maioria dos caracteres usados globalmente. -->
    <meta charset="UTF-8">

    <!-- Tag meta para configuração da visualização 
            responsiva em dispositivos móveis. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título da página, que aparece na aba do navegador. -->
    <title>Jogo de Matemática</title>

    <!-- Link para o arquivo de folha de estilo externo, 
            que contém os estilos CSS para formatar a página. -->
    <link rel="stylesheet" href="style.css">

<!-- Fim da seção head. -->
</head>


<!-- Início do corpo da página HTML, onde o conteúdo 
        visível é colocado. -->
<body>

    <!-- Divisão principal que atua como um contêiner para 
            todos os elementos visíveis relacionados ao jogo. -->
    <div class="container">

        <!-- Cabeçalho principal da página, apresentando o título do jogo. -->
        <h1>Jogo de Matemática</h1>

        <!-- Parágrafo usado para exibir a questão atual do jogo. -->
        <p id="questao" class="questao"></p>

        <!-- Campo de entrada para a resposta do usuário, do 
                tipo numérico. -->
        <input type="number" id="resposta" class="input" placeholder="Sua resposta...">

        <!-- Botão para submeter a resposta do usuário ao jogo. -->
        <button id="btn-responder" class="btn">Responder</button>

        <!-- Parágrafos que exibem a pontuação, o número de 
                acertos, as vidas restantes e o tempo disponível. -->
        <p id="pontos">Pontos: 0</p>
        <p id="acertos">Acertos: 0</p>
        <p id="vidas" class="vidas">Vidas: 3</p>
        <p id="tempo" class="tempo">Tempo: 10</p>
        
    </div>

    <!-- Referência ao arquivo JavaScript externo que 
            contém a lógica do jogo. -->
    <script src="script.js"></script>

<!-- Fim do corpo da página HTML. -->
</body>

<!-- Fim do documento HTML. -->
</html>
