<!-- Define o tipo de documento como HTML5, garantindo que o 
      navegador interprete corretamente a página. -->
<!DOCTYPE html>

<!-- Inicia o documento HTML e define o idioma da página 
          como Português do Brasil. 
     Isso é útil para motores de busca e leitores de tela. -->
<html lang="pt-BR">

<!-- Inicia a seção <head>, que contém metadados e configurações 
          da página, como título, codificação de caracteres e estilos. -->
<head>

  <!-- Define a codificação de caracteres como UTF-8, garantindo 
        suporte para acentos e caracteres especiais corretamente. -->
  <meta charset="UTF-8" />

  <!-- Define o título da página, que será exibido na aba 
        do navegador e usado pelos motores de busca. -->
  <title>Finalizar Reserva</title>

  <!-- Configura a responsividade da página para se ajustar ao 
            tamanho da tela do dispositivo. 
       'width=device-width' faz a página ocupar toda a largura do dispositivo.
       'initial-scale=1' mantém o zoom padrão, garantindo uma visualização adequada. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Inicia a seção de estilos CSS dentro do documento, permitindo a 
        personalização da aparência dos elementos da página. -->
  <style>

    /* Layout geral */
    /* Define o estilo global do corpo da página (body), 
          aplicando fonte padrão e cores. */
    body {

      /* Define a fonte padrão como Arial ou, caso não disponível, 
            qualquer fonte sans-serif. */
      font-family: Arial, sans-serif;

      /* Define a cor de fundo da página como um tom de cinza claro (#f4f4f4), 
            proporcionando um visual suave e agradável. */
      background: #f4f4f4;

      /* Remove todas as margens externas do body, evitando 
            espaços desnecessários. */
      margin: 0;

      /* Remove o espaçamento interno padrão do body, garantindo 
            um layout mais controlado. */
      padding: 0;

      /* Permite que a página tenha rolagem normal caso o 
            conteúdo seja maior que a tela, evitando cortes e 
            garantindo uma boa experiência de navegação. */

    }

    /* Define o estilo do contêiner principal que envolve 
          os elementos da página. */
    .container {
      
      /* Define a cor de fundo do contêiner como branco, 
            destacando-o sobre o fundo cinza. */
      background: white;

      /* Define a largura do contêiner como 95% da largura da tela,
            garantindo um layout responsivo que se ajusta a     
            diferentes tamanhos de tela. */
      width: 95%;

      /* Define um limite máximo de largura de 450px, 
            garantindo que o layout permaneça legível
            e bem estruturado, mesmo em telas maiores. */
      max-width: 450px;

      /* Define uma margem superior e inferior de 20px e 
            centraliza o contêiner horizontalmente. 
        Isso evita cortes e mantém o design equilibrado. */
      margin: 20px auto;

      /* Adiciona um preenchimento interno de 20px para afastar os 
            elementos das bordas do contêiner,
            melhorando a legibilidade e organização. */
      padding: 20px;

      /* Arredonda os cantos do contêiner com um raio de 10px, 
            proporcionando um design mais moderno
            e agradável. */
      border-radius: 10px;

      /* Adiciona uma leve sombra ao contêiner para destacá-lo 
              visualmente do fundo. 
        '0px' deslocamento horizontal, '4px' deslocamento 
              vertical, '10px' desfoque e uma cor 
              preta com 10% de opacidade. */
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);

      /* Centraliza todo o texto dentro do contêiner, 
              garantindo um alinhamento uniforme. */
      text-align: center;

    }


    /* Define o estilo do título principal (h1),  
          usado para o cabeçalho da página. */
    h1 {

          /* Define o tamanho da fonte como 1.5rem (equivalente a 
                  aproximadamente 24px), garantindo que o título 
                  seja destacado sem ser excessivamente grande. */
          font-size: 1.5rem;

          /* Define a cor do texto como um tom escuro de cinza (#333), 
            proporcionando um bom contraste e legibilidade. */
          color: #333;

          /* Adiciona um espaçamento na parte inferior do título de 20px,
            criando um espaço entre o título e os elementos seguintes. */
          margin-bottom: 20px;

    }

    /* Define o estilo do contêiner que agrupa os campos do formulário. */
    .campo-container {

          /* Alinha o texto dentro do contêiner à esquerda, 
                garantindo que os rótulos dos campos de 
                entrada (labels) fiquem bem posicionados. */
          text-align: left;

          /* Adiciona um espaçamento na parte inferior de 
                  15px para separar os campos do formulário, evitando 
                  que fiquem muito próximos uns dos outros. */
          margin-bottom: 15px;

    }


    /* Define o estilo para os rótulos (labels) dos campos 
          de entrada do formulário */
    .labelCampo {

          /* Define o peso da fonte como negrito para destacar 
                os rótulos dos campos */
          font-weight: bold;

          /* Define a cor do texto em um tom intermediário de cinza (#555), 
            tornando-o legível sem ser excessivamente escuro */
          color: #555;

          /* Define o rótulo como um elemento de bloco para 
                que ocupe toda a largura disponível, 
                garantindo que o campo de entrada fique abaixo dele */
          display: block;

          /* Adiciona um espaçamento de 5px na parte inferior do rótulo, 
            criando um espaço entre ele e o campo de entrada */
          margin-bottom: 5px;
          
    }

    /* Define o estilo para os campos de entrada do formulário */
    .campo {

          /* Define a largura do campo como 100%, garantindo que ele ocupe 
                toda a largura disponível do contêiner pai */
          width: 100%;

          /* Adiciona um preenchimento interno de 8px para 
                proporcionar conforto visual 
                ao digitar no campo */
          padding: 8px;

          /* Define o tamanho da fonte como 1rem (equivalente a 
                16px na maioria dos navegadores),
                garantindo uma leitura confortável */
          font-size: 1rem;

          /* Adiciona uma borda cinza (#ccc) de 1px ao 
                redor do campo para dar um 
                visual limpo e discreto */
          border: 1px solid #ccc;

          /* Arredonda levemente os cantos do campo 
                em 5px, proporcionando um 
                design mais moderno e agradável */
          border-radius: 5px;

          /* Remove o contorno azul padrão ao focar no campo, 
            mas será substituído por uma transição personalizada */
          outline: none;

          /* Adiciona um efeito de transição suave de 0.3s 
                quando o usuário interagir 
                com o campo, alterando a borda */
          transition: border 0.3s;

    }


    /* Estiliza o campo de entrada quando está 
          focado pelo usuário */
    .campo:focus {

          /* Altera a cor da borda para azul (#007bff) 
                  quando o usuário clica ou usa 
                  a tecla "Tab" para acessar o campo, criando um efeito visual 
                  que indica que o campo está ativo */
          border: 1px solid #007bff;

    }

    /* Estiliza a seção que contém os botões */
    .botoes {

          /* Utiliza o modelo de layout flexbox para 
                  organizar os botões horizontalmente */
          display: flex;

          /* Distribui o espaço disponível igualmente entre os botões,
            garantindo que fiquem separados uniformemente */
          justify-content: space-between;

          /* Adiciona um espaçamento superior de 20px, separando os botões dos 
            campos do formulário para melhor organização */
          margin-top: 20px;

          /* Adiciona um espaçamento de 10px entre os botões,
            garantindo que não fiquem muito próximos um do outro */
          gap: 10px;

    }


    /* Estiliza os botões do formulário */
    button {

          /* Define que o botão ocupará igualmente o espaço 
                  disponível dentro do contêiner flexível.
            Isso faz com que os botões tenham o mesmo tamanho 
                  quando alinhados lado a lado */
          flex: 1;

          /* Define um preenchimento interno de 10 pixels para 
                aumentar a área clicável do botão,
                tornando-o mais confortável para o usuário interagir */
          padding: 10px;

          /* Define o tamanho da fonte para 1rem (equivalente ao 
                tamanho padrão do texto do navegador),
                garantindo boa legibilidade em diferentes telas */
          font-size: 1rem;

          /* Remove a borda padrão dos botões para um design mais limpo */
          border: none;

          /* Arredonda levemente as bordas do botão para um visual moderno */
          border-radius: 5px;

          /* Muda o cursor para a forma de "mãozinha" quando o 
                usuário passa o mouse sobre o botão,
                indicando que ele é clicável */
          cursor: pointer;

          /* Define um efeito de transição suave de 0.3 segundos ao 
                alterar o fundo do botão, proporcionando uma 
                animação agradável ao passar o mouse */
          transition: background 0.3s;
          
    }

    /* Estiliza o botão "Voltar" especificamente */
    #btnVoltar {

          /* Define um fundo cinza claro (#ccc) para o botão, 
                indicando que ele não é a ação principal */
          background: #ccc;

          /* Define a cor do texto como preto para garantir 
                contraste adequado com o fundo */
          color: black;

    }

    /* Estiliza o botão "Voltar" quando o usuário 
          passa o mouse sobre ele */
    #btnVoltar:hover {

          /* Altera a cor de fundo para um cinza um pouco mais escuro (#bbb),
            criando um efeito de destaque sutil ao passar o mouse */
          background: #bbb;

    }


    /* Estiliza o botão de submissão do formulário */
    button[type="submit"] {

          /* Define a cor de fundo do botão como azul (#007bff), 
            destacando-o como a ação principal da interface */
          background: #007bff;

          /* Define a cor do texto do botão como branco, garantindo 
            um contraste adequado para melhor legibilidade */
          color: white;

    }

    /* Estiliza o botão de submissão quando o usuário 
          passa o mouse sobre ele */
    button[type="submit"]:hover {
      
          /* Altera a cor de fundo para um azul mais escuro (#0056b3), 
            criando um efeito de destaque ao passar o mouse */
          background: #0056b3;

    }

    /* Estiliza a exibição do resultado do cálculo ou processamento */
    #resultadoValor {

          /* Adiciona um espaçamento na parte superior de 20 pixels, 
            separando o resultado de outros elementos da página */
          margin-top: 20px;

          /* Define o tamanho da fonte para 1.1rem (um pouco maior que o padrão),
            tornando o resultado mais visível e destacável */
          font-size: 1.1rem;

          /* Define o peso da fonte como "bold" (negrito), 
            garantindo maior ênfase ao resultado exibido */
          font-weight: bold;

          /* Define a cor do texto como verde, indicando uma mensagem positiva 
            ou um valor calculado com sucesso */
          color: green;

    }


    /* Responsividade extra para telas muito pequenas */
    /* Define regras de estilo específicas para telas 
          menores que 400 pixels de largura */
    @media (max-width: 400px) {

          /* Altera a disposição dos botões quando a largura 
                da tela for menor que 400px */
          .botoes {

                /* Muda a direção do flex container para coluna, 
                  fazendo com que os botões fiquem empilhados verticalmente */
                flex-direction: column;

          }

          /* Estiliza os botões para melhorar o 
                espaçamento em telas pequenas */
          button {

                /* Adiciona um espaçamento na parte inferior 
                      de 10px entre os botões, garantindo um melhor 
                      espaçamento quando empilhados */
                margin-bottom: 10px;

          }
    }

  </style>
</head>


<!-- Início do corpo do documento HTML -->
<body>

  <!-- Cria um contêiner centralizado para exibir o conteúdo da página -->
  <div class="container">

    <!-- Título principal da página -->
    <h1>Finalizar Reserva</h1>

    <!-- Início do formulário para finalizar a reserva -->
    <form id="formFinalizarReserva">

      <!-- Campo oculto que armazena o ID da reserva.
           Esse campo não é visível para o usuário, mas é 
                necessário para que o sistema saiba qual 
                reserva está sendo finalizada. -->
      <input type="hidden" id="reservaId">


      <!-- Bloco responsável por exibir a vaga que foi reservada -->
      <div class="campo-container">

        <!-- Rótulo do campo da vaga, serve para indicar ao 
              usuário qual informação está sendo exibida -->
        <label class="labelCampo" for="vaga">Vaga:</label>

        <!-- Campo de entrada que exibe a vaga reservada pelo usuário.
             - O atributo 'id="vaga"' permite identificar esse 
                    campo no JavaScript.
             - A classe 'campo' aplica estilos definidos no CSS para 
                    manter um design uniforme.
             - O atributo 'readonly' impede que o usuário altere o valor, 
                    pois ele já foi preenchido automaticamente pelo sistema. -->
        <input type="text" id="vaga" class="campo" readonly>

      </div>

      <!-- Bloco responsável por exibir a data e a hora em 
              que a reserva começou -->
      <div class="campo-container">

        <!-- Rótulo do campo de data/hora de início da reserva -->
        <label class="labelCampo" for="dataInicio">Data/Hora Início:</label>

        <!-- Campo de entrada que exibe a data e a hora em que a 
                  reserva teve início.
             - O 'id="dataInicio"' permite que esse campo seja 
                  manipulado via JavaScript.
             - A classe 'campo' mantém a formatação de estilo para 
                  todos os campos de entrada.
             - O atributo 'readonly' impede que o usuário edite a 
                  informação manualmente, garantindo que os dados 
                  mostrados são os corretos. -->
        <input type="text" id="dataInicio" class="campo" readonly>

      </div>

      <!-- Bloco responsável por exibir a placa do veículo 
            relacionado à reserva -->
      <div class="campo-container">

        <!-- Rótulo do campo de placa, serve para indicar ao 
              usuário qual informação está sendo exibida -->
        <label class="labelCampo" for="placa">Placa:</label>

        <!-- Campo de entrada que exibe a placa do veículo vinculado à reserva.
             - O atributo 'id="placa"' permite que esse campo seja 
                    identificado e manipulado no JavaScript.
             - A classe 'campo' mantém a estilização consistente com 
                    os outros campos da página.
             - O atributo 'readonly' impede que o usuário edite esse campo, 
                    pois a placa já foi registrada no sistema. -->
        <input type="text" id="placa" class="campo" readonly>

      </div>

      <!-- Bloco responsável por exibir o modelo do veículo 
            relacionado à reserva -->
      <div class="campo-container">

        <!-- Rótulo do campo de modelo do veículo -->
        <label class="labelCampo" for="modelo">Modelo:</label>

        <!-- Campo de entrada que exibe o modelo do veículo vinculado à reserva.
             - O 'id="modelo"' permite que esse campo seja identificado e 
                    preenchido automaticamente no JavaScript.
             - A classe 'campo' garante a aplicação do estilo adequado.
             - O atributo 'readonly' impede a edição manual pelo usuário, 
                    assegurando que os dados exibidos sejam os 
                    registrados no sistema. -->
        <input type="text" id="modelo" class="campo" readonly>

      </div>


      <!-- Bloco responsável por exibir a cor do veículo vinculado à reserva -->
      <div class="campo-container">

        <!-- Rótulo do campo de cor do veículo, indicando ao usuário 
                qual informação está sendo exibida -->
        <label class="labelCampo" for="cor">Cor:</label>

        <!-- Campo de entrada que exibe a cor do veículo associado à reserva.
             - O atributo 'id="cor"' permite que esse campo seja 
                    identificado e manipulado via JavaScript.
             - A classe 'campo' garante que a estilização seja 
                    aplicada corretamente.
             - O atributo 'readonly' impede que o usuário edite esse 
                    campo, assegurando que a informação apresentada 
                    seja fiel ao que está no sistema. -->
        <input type="text" id="cor" class="campo" readonly>

      </div>

      <!-- Bloco responsável por exibir o nome do proprietário do veículo -->
      <div class="campo-container">

        <!-- Rótulo do campo de proprietário do veículo -->
        <label class="labelCampo" for="proprietario">Proprietário:</label>

        <!-- Campo de entrada que exibe o nome do proprietário do 
                  veículo vinculado à reserva.
             - O 'id="proprietario"' permite que o campo seja identificado e 
                  preenchido automaticamente via JavaScript.
             - A classe 'campo' mantém a formatação e o estilo adequados.
             - O atributo 'readonly' impede edições manuais, garantindo 
                  que os dados sejam exibidos exatamente como
                  registrados no sistema. -->
        <input type="text" id="proprietario" class="campo" readonly>

      </div>


      <!-- Bloco responsável por permitir ao usuário definir a 
            data de término da reserva -->
      <div class="campo-container">

        <!-- Rótulo do campo de Data Fim, informando ao usuário o 
                que ele precisa preencher -->
        <label class="labelCampo" for="dataFim">Data Fim:</label>

        <!-- Campo de entrada do tipo 'date' para selecionar a 
                  data de finalização da reserva.
             - O 'id="dataFim"' permite que esse campo seja 
                  identificado e manipulado via JavaScript.
             - A classe 'campo' assegura que o estilo padrão seja aplicado.
             - O atributo 'required' força o preenchimento deste 
                  campo antes de concluir a ação. -->
        <input type="date" id="dataFim" class="campo" required>

      </div>

      <!-- Bloco responsável por permitir ao usuário definir a 
              hora de término da reserva -->
      <div class="campo-container">

        <!-- Rótulo do campo de Hora Fim, indicando que o usuário 
              deve definir um horário -->
        <label class="labelCampo" for="horaFim">Hora Fim:</label>

        <!-- Campo de entrada do tipo 'time' para que o usuário selecione a 
                  hora de término da reserva.
             - O 'id="horaFim"' permite que esse campo seja identificado e 
                  atualizado dinamicamente via JavaScript.
             - A classe 'campo' mantém a padronização visual.
             - O atributo 'required' obriga o usuário a preencher esse 
                  campo antes de finalizar. -->
        <input type="time" id="horaFim" class="campo" required>

      </div>


      <!-- Bloco que contém os botões de ação -->
      <div class="botoes">

        <!-- Botão de voltar para a tela anterior
             - 'type="button"': indica que esse botão não submete o formulário, 
                    apenas executa uma ação específica.
             - 'id="btnVoltar"': permite que o JavaScript identifique e 
                    manipule esse botão.
             - O texto "Voltar" informa ao usuário a funcionalidade do botão. -->
        <button type="button" id="btnVoltar">Voltar</button>

        <!-- Botão para finalizar a reserva 
             - 'type="submit"': faz com que o formulário seja enviado 
                    quando o botão for clicado.
             - O texto "Finalizar Reserva" informa ao usuário que essa ação 
                    concluirá o processo de reserva. -->
        <button type="submit">Finalizar Reserva</button>

      </div>
      
    <!-- Fim do formulário de finalização da reserva -->
    </form> 

    <!-- Div onde será exibido o valor final da reserva após o cálculo 
         - 'id="resultadoValor"': permite que o JavaScript atualize 
                essa área dinamicamente.
         - Inicialmente, essa div estará vazia e será preenchida conforme 
                os dados forem processados. -->
    <div id="resultadoValor"></div>

  </div>

  <script>

    // Adiciona um evento à janela do navegador que será executado assim 
    //    que a página for totalmente carregada.
    // O evento 'load' garante que todos os elementos da 
    //    página (HTML, CSS, imagens) estejam prontos antes de rodar o código.
    window.addEventListener('load', async () => {

      // Cria um objeto chamado 'params' que permite acessar os parâmetros da URL.
      // Os parâmetros da URL são valores que aparecem após o 
      //    símbolo "?" no link.
      // Exemplo: se o link for "finalizarReserva.html?id=123", 
      //    então o parâmetro 'id' contém o valor "123".
      const params = new URLSearchParams(window.location.search);

      // Obtém o valor do parâmetro 'id' da URL e armazena 
      //    na variável 'idReserva'.
      // Esse valor representa o identificador único da 
      //    reserva que será carregada na página.
      // Se a URL não contiver um ID, a variável 'idReserva' será 'null'.
      const idReserva = params.get('id');

      // Verifica se o ID da reserva não foi informado na URL.
      // Se 'idReserva' for null ou undefined, significa 
      //    que a URL não possui um ID válido.
      if (!idReserva) {

        // Exibe um alerta para o usuário informando que a 
        //    reserva não foi especificada.
        alert('Reserva não especificada!');

        // Retorna, interrompendo a execução do código, pois sem 
        //    um ID válido não é possível buscar os dados.
        return;

      }

      try {

        // Faz uma requisição assíncrona (fetch) para buscar os dados da reserva na API.
        // O ID da reserva é inserido dinamicamente na URL, formando um link como:
        // "http://127.0.0.1:3000/api/reservas/123", onde "123" seria o ID da reserva.
        const resposta = await fetch(`http://127.0.0.1:3000/api/reservas/${idReserva}`);

        // Verifica se a resposta da API não foi bem-sucedida (status diferente de 200).
        if (!resposta.ok) {

          // Exibe um alerta informando ao usuário que houve um 
          //    erro ao carregar os dados.
          alert('Erro ao carregar dados da reserva.');

          // Interrompe a execução para evitar erros posteriores.
          return;

        }

        // Converte a resposta do servidor para formato JSON.
        // Isso transforma os dados recebidos da API em 
        //    um objeto JavaScript utilizável.
        const reserva = await resposta.json();

        // Preenche o campo oculto 'reservaId' com o ID da reserva obtido da API.
        // Esse campo é importante para identificar a 
        //    reserva ao finalizar a edição.
        document.getElementById('reservaId').value = reserva._id;

        // Preenche o campo 'vaga' com a vaga da reserva, que 
        //    representa onde o veículo está estacionado.
        document.getElementById('vaga').value = reserva.vaga;

        // Converte a data e hora de início da reserva para um formato 
        //    mais legível e preenche o campo 'dataInicio'.
        // A função 'formataDataHora' é chamada para transformar a 
        //    data recebida da API (que pode estar em um formato ISO, 
        //    como "2024-03-16T15:30:00Z").
        document.getElementById('dataInicio').value = formataDataHora(new Date(reserva.dataHoraInicio));

        // Preenche o campo 'placa' com a placa do veículo associado à reserva.
        // Se a API não retornar um valor (caso o campo esteja vazio ou 
        //    indefinido), será atribuído uma string vazia ('').
        document.getElementById('placa').value = reserva.placaVeiculo || '';

        // Preenche o campo 'modelo' com o modelo do veículo reservado.
        // Se a API não retornar um modelo, o campo será deixado em branco.
        document.getElementById('modelo').value = reserva.modeloVeiculo || '';

        // Preenche o campo 'cor' com a cor do veículo.
        // Se a API não fornecer essa informação, o campo ficará vazio.
        document.getElementById('cor').value = reserva.corVeiculo || '';

        // Preenche o campo 'proprietario' com o nome do proprietário do veículo.
        // Caso a API não retorne um proprietário, o campo será deixado em branco.
        document.getElementById('proprietario').value = reserva.proprietarioVeiculo || '';

      // Caso ocorra algum erro durante a requisição à API, o bloco 'catch' será acionado.
      // Isso pode acontecer por vários motivos, como falta de 
      //    conexão com o servidor, URL incorreta, 
      //    falha na resposta da API ou erro interno no servidor.
      } catch (erro) {

        // Exibe uma mensagem de erro no console do navegador.
        // Isso ajuda os desenvolvedores a identificar a causa do problema.
        console.error('Erro ao buscar reserva:', erro);

        // Mostra um alerta para o usuário informando que houve 
        //    um erro ao carregar os dados da reserva.
        alert('Erro ao carregar dados da reserva.');

      }

    });

    // Função para formatar uma data e hora em um formato 
    //    legível no padrão brasileiro (DD/MM/AAAA HH:MM).
    function formataDataHora(dt) {

      // Obtém o dia do mês da data fornecida.
      // O método getDate() retorna um número entre 1 e 31.
      // Convertendo para string e usando padStart(2, '0') para 
      //    garantir que sempre tenha dois dígitos (ex: 01, 02, ..., 09, 10, ..., 31).
      const dia = String(dt.getDate()).padStart(2, '0');

      // Obtém o mês da data fornecida.
      // O método getMonth() retorna um número de 0 a 11, 
      //    onde 0 é janeiro e 11 é dezembro.
      // Por isso, somamos 1 para que fique no formato correto (1 a 12).
      // Convertendo para string e garantindo dois dígitos com padStart(2, '0').
      const mes = String(dt.getMonth() + 1).padStart(2, '0');

      // Obtém o ano da data fornecida.
      // O método getFullYear() retorna o ano completo 
      //    com quatro dígitos (ex: 2024).
      const ano = dt.getFullYear();

      // Obtém a hora do dia da data fornecida.
      // O método getHours() retorna um número entre 0 e 23 
      //    representando a hora.
      // Convertendo para string e garantindo dois 
      //    dígitos com padStart(2, '0').
      const hora = String(dt.getHours()).padStart(2, '0');

      // Obtém os minutos da hora da data fornecida.
      // O método getMinutes() retorna um número entre 0 e 59 
      //    representando os minutos.
      // Convertendo para string e garantindo dois dígitos 
      //    com padStart(2, '0').
      const min = String(dt.getMinutes()).padStart(2, '0');

      // Retorna a data e hora formatadas no padrão brasileiro.
      // Template string é usado para unir as variáveis no 
      //    formato: DD/MM/AAAA HH:MM.
      return `${dia}/${mes}/${ano} ${hora}:${min}`;

    }

    // Seleciona o botão com o ID 'btnVoltar' e adiciona um 
    //    evento de clique a ele.
    document.getElementById('btnVoltar').addEventListener('click', () => {

      // Quando o botão for clicado, a página será 
      //    redirecionada para 'principal.html'.
      // Isso significa que o usuário será levado para a 
      //    página principal do sistema.
      window.location.href = 'principal.html';

    });


    // Adiciona um evento de submissão ao formulário 
    //    com o ID 'formFinalizarReserva'.
    // Esse evento será acionado quando o usuário 
    //    clicar no botão de 'Finalizar Reserva'.
    document.getElementById('formFinalizarReserva').addEventListener('submit', async (e) => {

      // Impede que o comportamento padrão do formulário ocorra, ou seja,
      // evita que a página seja recarregada ao enviar o formulário.
      e.preventDefault();

      // Obtém o valor do campo oculto 'reservaId', que contém o ID da reserva
      // Essa informação é necessária para identificar 
      //    qual reserva está sendo finalizada.
      const idReserva = document.getElementById('reservaId').value;

      // Obtém a data final inserida pelo usuário no campo 'dataFim'.
      // Esse campo é obrigatório para definir quando a reserva foi finalizada.
      const dataFim = document.getElementById('dataFim').value;

      // Obtém a hora final inserida pelo usuário no campo 'horaFim'.
      // Também é obrigatória para indicar o horário exato do fim da reserva.
      const horaFim = document.getElementById('horaFim').value;

      // Verifica se os campos 'dataFim' e 'horaFim' estão preenchidos.
      // Se um deles estiver vazio, o usuário receberá um 
      //    alerta informando que precisa preencher os dois campos.
      if (!dataFim || !horaFim) {

        alert('Preencha data e hora de fim.');

        // Interrompe a execução do código para evitar 
        //    erro no envio de dados incompletos.
        return; 
        
      }


      try {

        // Faz uma requisição HTTP do tipo PUT para a API que finaliza a reserva.
        // A URL contém o ID da reserva para que o servidor 
        //    saiba qual reserva deve ser finalizada.
        const resposta = await fetch(`http://127.0.0.1:3000/api/reservas/finalizar/${idReserva}`, {
          
          // Define o método da requisição como 'PUT', que é 
          //    utilizado para atualizar informações no servidor.
          method: 'PUT',

          // Define os cabeçalhos da requisição. 
          // O 'Content-Type' indica que os dados enviados estão no formato JSON.
          headers: { 'Content-Type': 'application/json' },

          // Envia os dados da data e hora final da reserva 
          //    convertidos em formato JSON.
          // O JSON.stringify transforma o objeto JavaScript em 
          //    uma string JSON para ser interpretada pelo servidor.
          body: JSON.stringify({ dataFim, horaFim })

        });

        // Aguarda a resposta do servidor e a converte para JSON.
        // Essa resposta pode conter mensagens de sucesso ou erro vindas da API.
        const dados = await resposta.json();

        // Verifica se a resposta da requisição não foi bem-sucedida.
        // A propriedade 'ok' de um objeto Response retorna true se o 
        //    status da resposta estiver entre 200 e 299.
        if (!resposta.ok) {
          
          // Exibe um alerta informando que a reserva não pôde ser finalizada.
          // Se a API retornar uma mensagem de erro, ela será exibida. 
          // Caso contrário, usa uma mensagem padrão.
          alert(dados.mensagem || 'Não foi possível finalizar a reserva.');
          
          // Interrompe a execução da função para evitar que 
          //    prossiga após um erro.
          return;

        }

        // Seleciona a div onde será exibido o valor final da 
        //    reserva após sua conclusão.
        const valorDiv = document.getElementById('resultadoValor');

        // Atualiza o conteúdo da div 'resultadoValor' com as 
        //    informações da reserva finalizada.
        // Isso informa ao usuário que a reserva foi concluída 
        //    com sucesso e exibe o tempo de uso e o valor total a pagar.
        valorDiv.innerHTML = `
          <strong>Reserva finalizada!</strong><br> 
          Você utilizou a vaga por <strong>${dados.horas}</strong> hora(s).<br> 
          O valor total a ser pago é: <strong>R$ ${dados.valor},00</strong>
        `;

        // Desabilita o botão de submissão do formulário para evitar 
        //    que o usuário tente finalizar a mesma reserva novamente.
        // O 'e.target' refere-se ao formulário que acionou o 
        //    evento de envio ('submit').
        // O 'querySelector' busca dentro do formulário um botão do 
        //    tipo 'submit' e o 'disabled = true' impede que
        //    ele seja clicado novamente.
        e.target.querySelector('[type="submit"]').disabled = true;

      // Captura qualquer erro que possa ocorrer durante o 
      //    processo de finalização da reserva.
      } catch (erro) {
        
        // Exibe a mensagem de erro no console do navegador, útil para depuração.
        console.error('Erro ao finalizar reserva:', erro);
        
        // Alerta o usuário de que ocorreu um erro ao 
        //    tentar finalizar a reserva.
        // Essa mensagem informa que algo deu errado, mas 
        //    sem expor detalhes técnicos.
        alert('Erro ao finalizar reserva.');

      }

    });
  
  // Fim da seção de script onde o código JavaScript é executado
  </script>

</body>
