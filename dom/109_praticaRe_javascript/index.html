<!DOCTYPE html>
<!-- Declaração do tipo de documento como HTML5. Isso é 
            essencial para garantir que o navegador 
            interprete a página corretamente. -->

<html lang="pt">
<!-- Início do elemento raiz do documento HTML. O atributo 'lang' 
            define o idioma da página como português. -->

<head>
    <!-- Início da seção de cabeçalho do documento HTML. Aqui são 
            colocados metadados, links para estilos e scripts. -->

    <meta charset="UTF-8">
    <!-- Define a codificação de caracteres como UTF-8, que suporta 
            quase todos os caracteres de todos os idiomas. 
            Isso garante que o texto seja exibido corretamente. -->

    <title>Práticas Recomendadas no JavaScript</title>
    <!-- Define o título da página, que é exibido na aba do navegador. 
     Este título deve ser descritivo do conteúdo da página. -->

</head>

<body>
    <!-- Início do corpo do documento HTML, onde são colocados 
                todos os elementos visíveis ao usuário. -->

    <h2>Lista de Itens</h2>
    <!-- Cabeçalho de segundo nível indicando a seção 
                de lista de itens. -->

    <ul id="listaItens">
        <!-- Lista não ordenada com o ID 'listaItens'. Este ID é 
                usado para manipulação do elemento via JavaScript. -->

        <li>Item 1</li>
        <!-- Primeiro item da lista. -->

        <li>Item 2</li>
        <!-- Segundo item da lista. -->

        <li>Item 3</li>
        <!-- Terceiro item da lista. -->

    </ul>

    <input type="text" id="novoItem" placeholder="Adicione um novo item">
    <!-- Campo de entrada de texto com o ID 'novoItem' e um placeholder 
                orientando o usuário a adicionar um novo item. 
        O ID é usado para referenciar o elemento no JavaScript. -->

    <button id="adicionarItem">Adicionar Item</button>
    <!-- Botão com o ID 'adicionarItem'. Quando clicado, adiciona um 
                novo item à lista. O ID é usado para referenciar o 
                elemento no JavaScript. -->

    <script src="script.js"></script>
    <!-- Inclusão do arquivo JavaScript 'script.js'. Este arquivo 
                contém a lógica para adicionar itens à lista e 
                manipular eventos. -->
                
</body>
</html>
