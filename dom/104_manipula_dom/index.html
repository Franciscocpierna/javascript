<!DOCTYPE html>
<!-- Define o tipo de documento como HTML5, que é a
        versão padrão atual do HTML. -->

<html lang="pt">
<!-- Define o elemento raiz do documento HTML e especifica o 
        idioma principal do documento como português. -->

<head>
    <!-- Abre a seção de cabeçalho do documento HTML, onde são 
            colocados metadados, links para scripts e folhas 
            de estilo. -->

    <meta charset="UTF-8">
    <!-- Define o conjunto de caracteres utilizado no documento 
                como UTF-8, que suporta todos os caracteres de todos os 
                idiomas usados no mundo. -->

    <title>Manipulação de Elementos no DOM</title>
    <!-- Define o título do documento, que aparece na aba do navegador. 
                Este título é 'Manipulação de Elementos no DOM'. -->

</head>

<body>
    <!-- Abre a seção do corpo do documento HTML, onde todo o 
                conteúdo visível é colocado. -->

    <h1 id="titulo">Título Inicial</h1>
    <!-- Define um cabeçalho de primeiro nível com o ID 'titulo'. 
                Este cabeçalho contém o texto 'Título Inicial'. -->

    <div id="conteudo">
        <!-- Define uma divisão ou seção com o ID 'conteudo', usada para 
                agrupar elementos relacionados. -->

        <p>Texto inicial da página.</p>
        <!-- Inclui um parágrafo dentro da divisão que contém o 
                    texto 'Texto inicial da página.'. -->

    </div>

    <button id="mudarTexto">Mudar Texto</button>
    <!-- Define um botão com o ID 'mudarTexto'. Quando clicado, um 
                script altera o texto do título. -->

    <button id="modificarHTML">Modificar HTML</button>
    <!-- Define um botão com o ID 'modificarHTML'. Quando clicado, um 
                script modifica o HTML dentro da div 'conteudo'. -->

    <button id="adicionarElemento">Adicionar Elemento</button>
    <!-- Define um botão com o ID 'adicionarElemento'. Quando clicado, um 
                script adiciona um novo elemento ao DOM. -->

    <button id="removerElemento">Remover Elemento</button>
    <!-- Define um botão com o ID 'removerElemento'. Quando clicado, um 
                script remove um elemento dentro da div 'conteudo'. -->

    <button id="substituirElemento">Substituir Elemento</button>
    <!-- Define um botão com o ID 'substituirElemento'. Quando clicado, um 
                script substitui um elemento dentro da div 'conteudo'. -->

    <script src="script.js"></script>
    <!-- Inclui um arquivo de script externo chamado 'script.js'. Este 
                script contém a lógica para manipular os elementos do DOM 
                com base nas ações do usuário nos botões. -->
                
</body>
</html>
