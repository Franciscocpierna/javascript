<!DOCTYPE html>
<!-- Declaração DOCTYPE indica ao navegador que esta é uma 
        página HTML5. Isso é essencial para garantir que a página 
        seja interpretada corretamente pelos navegadores modernos. -->

<html lang="pt">
<!-- A tag <html> marca o início do documento HTML. O atributo 'lang="pt"' 
            especifica que o idioma principal do documento é o português. 
    Isso ajuda na acessibilidade e SEO, melhorando a experiência do 
            usuário e a visibilidade do site em pesquisas. -->

<head>
    <!-- A tag <head> contém metadados sobre o documento, como seu conjunto de 
            caracteres, título e links para scripts e folhas de estilo. 
    Ela não é exibida diretamente na área de conteúdo da página. -->

    <meta charset="UTF-8">
    <!-- A meta tag com charset 'UTF-8' define o conjunto de caracteres 
            Unicode para o documento, suportando quase todos os idiomas do 
            mundo. Isso é crucial para a exibição correta de texto em 
            qualquer idioma. -->

    <title>Manipulação de Eventos no DOM</title>
    <!-- A tag <title> define o título do documento, que é exibido na 
                aba do navegador. "Manipulação de Eventos no DOM" informa ao 
                usuário sobre o conteúdo da página, sendo também utilizado para 
                melhorar a relevância da página nos resultados de busca. -->

</head>

<body>
    <!-- Início do corpo do documento HTML, onde são colocados todos os 
                elementos visíveis ao usuário quando a página é carregada. -->

    <button id="botaoClique">Clique em Mim</button>
    <!-- Um botão com o ID 'botaoClique' que os usuários podem clicar. 
     Este botão é usado para demonstrar a manipulação de eventos de 
                clique via JavaScript. -->

    <div id="areaHover" style="width: 200px; height: 100px; background-color: lightgrey;">
        <!-- Uma div com o ID 'areaHover' que serve como uma área interativa 
                para o usuário. Estilizada diretamente com um estilo inline 
                para definir sua largura, altura e cor de fundo. -->

        Passe o mouse aqui
        <!-- Instruções simples dentro da div incentivando o usuário a 
                interagir, movendo o mouse sobre a área. -->

    </div>

    <script src="script.js"></script>
    <!-- Inclusão do arquivo JavaScript 'script.js'. Este script contém a 
                lógica necessária para adicionar funcionalidade interativa aos 
                elementos acima, como responder a eventos de clique e hover. -->
                
</body>
</html>
