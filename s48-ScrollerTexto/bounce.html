<!DOCTYPE html>
<!-- A linha DOCTYPE declara o tipo do documento 
            como HTML5, que é a versão mais recente do HTML. 
            Isso ajuda o navegador a renderizar a página de 
            acordo com as regras do HTML5. -->

<html lang="pt-br">
<!-- A tag <html> inicia o documento HTML, com o atributo 'lang' 
            especificando o idioma do conteúdo da página como 
            português do Brasil. Isso é útil para acessibilidade 
            e SEO, indicando aos navegadores e ferramentas de 
            pesquisa o idioma principal da página. -->

<head>
    <!-- A tag <head> contém metadados sobre o documento HTML, 
            que não são exibidos diretamente na página web, 
            mas são importantes para o navegador. -->

    <meta charset="UTF-8">
    <!-- Define o conjunto de caracteres usado no documento 
                como UTF-8, que suporta quase todos os caracteres 
                de todos os idiomas e é a codificação mais 
                comum para web. Isso garante que o texto seja 
                exibido corretamente. -->

    <title>Efeito de Bounce</title>
    <!-- A tag <title> define o título da página, que é 
                exibido na aba do navegador. Este título 
                também é usado nos resultados de busca e é 
                importante para SEO. -->

    <link rel="stylesheet" href="estilos.css">
    <!-- A tag <link> é usada aqui para conectar uma folha 
                de estilos externa, 'estilos.css', ao documento. 
                Isso permite que você aplique estilos CSS externos 
                ao conteúdo da página. -->
     
</head>
<!-- Fim da tag <head>. -->

<body>
    <!-- A tag <body> contém todo o conteúdo principal da 
                página, como texto, imagens, vídeos, jogos, 
                links de navegação, etc., que são exibidos 
                no navegador. -->

    <div class="scroller-bounce">
    <!-- A tag <div> cria um contêiner para o texto com 
                efeito de bounce. A classe 'scroller-bounce' é 
                usada para aplicar estilos CSS e alguns 
                comportamentos de JavaScript específicos. -->

        <div class="conteudo-bounce">Este é um scroller de texto com efeito de bounce! Divirta-se!</div>
        <!-- Outra <div> contém o texto que será animado com o 
                    efeito de bounce. A classe 'conteudo-bounce' 
                    especificamente define o conteúdo que terá o 
                    comportamento animado aplicado via CSS ou JavaScript. -->

    </div>

    <script src="script.js"></script>
    <!-- A tag <script> com o atributo 'src' inclui um arquivo 
                    JavaScript externo, 'script.js', que contém 
                    código JavaScript para interagir ou modificar 
                    dinamicamente o comportamento dos elementos na 
                    página, incluindo possivelmente o scroller bounce. -->

</body>
<!-- Fim da tag <body>. -->
    
</html>
<!-- Fim do documento HTML. -->
