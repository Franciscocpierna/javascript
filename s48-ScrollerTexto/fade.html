<!DOCTYPE html>
<!-- Essa declaração indica ao navegador que a 
            versão do documento é HTML5. É o padrão 
            atual para HTML e assegura que recursos modernos 
            sejam corretamente interpretados pelo navegador. -->

<html lang="pt-br">
<!-- Abre o elemento <html>, que serve como o contêiner 
            raiz de todo o documento HTML. O atributo 'lang="pt-br"' 
            especifica que o idioma do conteúdo da página é 
            português brasileiro, que ajuda na acessibilidade e 
            na indexação correta pelo Google e outros 
            motores de busca. -->

<head>
    <!-- A tag <head> encapsula informações sobre o documento 
                que não são diretamente exibidas na página da web, 
                incluindo links para scripts e folhas de estilo, 
                metadados e outras instruções para o navegador. -->

    <meta charset="UTF-8">
    <!-- Esta linha define a codificação de caracteres para UTF-8, 
                que inclui suporte para praticamente todos os 
                caracteres de qualquer idioma. Isso garante que 
                qualquer texto no documento seja exibido corretamente. -->

    <title>Efeito de Fade</title>
    <!-- A tag <title> define o título da página, que é 
                mostrado na aba do navegador. Este título é 
                também usado pelos motores de busca e pode 
                impactar o SEO (otimização para motores de busca). -->

    <link rel="stylesheet" href="estilos.css">
    <!-- A tag <link> aqui é utilizada para incluir uma folha 
                de estilos externa, localizada no arquivo 'estilos.css'. 
                Esta folha de estilos contém as definições de CSS que 
                controlam a aparência do documento HTML. -->

</head>
<!-- Encerramento da tag <head>. Todas as informações 
                necessárias para o cabeçalho do documento 
                foram incluídas. -->

<body>
    <!-- A tag <body> contém todo o conteúdo principal que é 
                visível aos usuários quando eles visitam a página. -->

    <div class="scroller-fade">
    <!-- Uma <div> (divisão) que atua como um contêiner para o 
                texto com efeito de fade. A classe 'scroller-fade' é 
                usada para identificar e aplicar estilos CSS 
                específicos a este contêiner. -->

        <div class="conteudo-fade">Este é um scroller de texto com efeito de fade! Aproveite a leitura!</div>
        <!-- Outra <div> interna que contém o texto a ser animado. 
            A classe 'conteudo-fade' será referenciada pelos 
                        estilos CSS para aplicar especificamente o 
                        efeito de fade no texto. -->

    </div>

    <script src="script.js"></script>
    <!-- A tag <script> com o atributo 'src' que aponta 
                    para 'script.js', onde estão 
                    contidos os scripts JavaScript que gerenciam o 
                    comportamento dinâmico do scroller, como iniciar e 
                    manter o efeito de fade ou responder a 
                    interações do usuário. -->

</body>
<!-- Encerramento da tag <array> que delimita todo o 
                conteúdo visível da página. -->

</html>
<!-- Fim do documento HTML. Toda a estrutura básica 
                necessária para a página está completa. -->
