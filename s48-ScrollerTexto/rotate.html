<!DOCTYPE html>
<!-- Esta linha declara o tipo de documento como HTML5, 
            informando ao navegador que o documento deve ser 
            processado de acordo com os padrões HTML5. -->

<html lang="pt-br">
<!-- Abre a tag <html>, que encapsula todo o conteúdo HTML do 
            documento. O atributo 'lang="pt-br"' define o idioma 
            principal do conteúdo como português do Brasil, o 
            que é útil para acessibilidade e SEO. -->

<head>
    <!-- A tag <head> contém metadados e links para recursos 
                externos, como folhas de estilo e scripts, que não 
                são exibidos diretamente na página, mas são 
                essenciais para a configuração e funcionamento 
                do documento. -->

    <meta charset="UTF-8">
    <!-- Define a codificação de caracteres do documento 
                como UTF-8, garantindo suporte a uma ampla 
                variedade de caracteres e símbolos de diferentes 
                idiomas. Isso previne problemas de exibição de texto. -->

    <title>Efeito de Rotação</title>
    <!-- Define o título da página, que será exibido na aba do 
                navegador. Este título também é utilizado por 
                motores de busca e aparece nos resultados de 
                busca, sendo importante para SEO e usabilidade. -->

    <link rel="stylesheet" href="estilos.css">
    <!-- Conecta o documento HTML a uma folha de estilos externa 
                chamada 'estilos.css'. Esta folha de estilo contém as 
                definições de CSS que controlam a aparência e o 
                layout do conteúdo HTML. -->

</head>
<!-- Fecha a tag <head>, concluindo a seção de metadados e 
                links para recursos externos. -->

<body>
    <!-- A tag <body> contém todo o conteúdo visível da página 
                web, incluindo textos, imagens, vídeos e 
                outros elementos. -->

    <div class="scroller-rotate">
    <!-- Cria uma divisão (div) que serve como contêiner 
                para o scroller com efeito de rotação. 
                A classe 'scroller-rotate' aplica estilos 
                específicos que definem o comportamento e a 
                aparência do scroller. -->

        <div class="conteudo-rotate">Este é um scroller de rotação!</div>
        <!-- Outra <div> dentro do scroller que contém o texto a 
                    ser animado com o efeito de rotação. A classe 'conteudo-rotate' 
                    aplica estilos específicos de animação e visual ao conteúdo. -->

    </div>

    <script src="script.js"></script>
    <!-- Inclui um arquivo JavaScript externo chamado 'script.js'. 
                Este script pode adicionar funcionalidades dinâmicas, 
                como animações e interações, ao conteúdo do scroller. -->
</body>
<!-- Fecha a tag <body>, encerrando a seção do documento que 
            contém o conteúdo visível para o usuário. -->

</html>
<!-- Fecha a tag <html>, concluindo o documento HTML. Esta 
            estrutura completa garante que o conteúdo seja 
            exibido e funcione corretamente nos navegadores. -->
