<!DOCTYPE html>
<!-- Essa declaração define o tipo de documento 
            como HTML5, o mais recente padrão de HTML. 
            Ela informa aos navegadores modernos como 
            interpretar o restante do conteúdo do 
            documento corretamente. -->

<html lang="pt-br">
<!-- Abre a tag <html>, definindo o escopo do documento HTML. 
            O atributo 'lang="pt-br"' especifica que o idioma 
            principal do conteúdo é o português do Brasil, o 
            que ajuda mecanismos de busca e ferramentas de 
            acessibilidade a processar a página adequadamente. -->

<head>
    <!-- A tag <head> contém informações sobre o documento que 
                não são exibidas diretamente na página web, como 
                metadados, links para folhas de estilo e scripts. -->

    <meta charset="UTF-8">
    <!-- Esta meta tag define a codificação de caracteres do 
                documento para UTF-8, que suporta todos os 
                caracteres de qualquer idioma, assegurando 
                que não haja problemas de exibição de texto. -->

    <title>Efeito de LED</title>
    <!-- O <title> define o título da página, que é mostrado 
                na aba do navegador e utilizado pelos motores 
                de busca para informar sobre o conteúdo da 
                página. É importante para a usabilidade e SEO. -->

    <link rel="stylesheet" href="estilos.css">
    <!-- A tag <link> aqui é usada para conectar o documento HTML a 
                uma folha de estilos externa chamada 'estilos.css'. 
                Esta folha de estilo contém as regras CSS que 
                controlam a aparência visual do documento. -->

</head>
<!-- Fecha a tag <head>. -->

<body>
    <!-- A tag <body> envolve todo o conteúdo principal que é 
                visível para os usuários na página web. -->

    <div class="scroller-led">
    <!-- A <div> atua como um contêiner para o conteúdo do 
                efeito de LED. A classe 'scroller-led' é 
                usada para aplicar estilos específicos relacionados 
                ao efeito de scroller que simula um display de LED. -->

        <div class="conteudo-led">APROVEITE A PROMOÇÃO!</div>
        <!-- Outra <div> contém o texto que será exibido com o 
                    efeito de LED. A classe 'conteudo-led' pode ser 
                    usada para aplicar estilos específicos de animação 
                    ou visual, como cores brilhantes, piscar, ou 
                    deslizar o texto. -->

    </div>

    <script src="script.js"></script>
    <!-- A tag <script> inclui um arquivo JavaScript externo, 'script.js', 
                    que contém código para controlar ou adicionar 
                    comportamentos dinâmicos ao efeito de LED, como 
                    controlar a animação, iniciar automaticamente, etc. -->

</body>
<!-- Fim da tag <body>. -->

</html>
<!-- Encerra o documento HTML. Esta estrutura assegura que o 
            conteúdo seja exibido corretamente nos navegadores e 
            esteja bem organizado. -->
